[project]
name = "diagrid-test-triage-agent"
version = "0.1.0"
description = "Durable AI agent for automated CI/test failure triage on Diagrid Catalyst"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dapr-agents==1.0.0",
    "pyjwt>=2.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
